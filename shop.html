<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLE — Каталог</title>
    <link rel="stylesheet" href="shop.css">
</head>
<body>


<nav>
    <div class="nav-logo">S<span>O</span>LE</div>
    <ul class="nav-links">
        <li><a href="#" class="active">Каталог</a></li>
        <li><a href="#">Новинки</a></li>
        <li><a href="#">Бренды</a></li>
        <li><a href="#">О нас</a></li>
    </ul>
    <div class="nav-right">
        <span id="user-name"></span>
        <button id="cart-btn">🛒 Корзина <span id="cart-count">0</span></button>
        <button id="logout-btn" onclick="logout()">Выйти</button>
    </div>
</nav>


<section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
        <div class="hero-tag">★ Новая коллекция 2025</div>
        <h1>Носи то, что<br><em>выделяет</em> тебя</h1>
        <p>Лимитированные кроссовки и streetwear<br>от топовых брендов. Только оригиналы.</p>
    </div>
</section>


<div class="filters">
    <button class="filter-btn active" onclick="filterProducts('all', this)">Все</button>
    <button class="filter-btn" onclick="filterProducts('nike', this)">Nike</button>
    <button class="filter-btn" onclick="filterProducts('adidas', this)">Adidas</button>
    <button class="filter-btn" onclick="filterProducts('new_balance', this)">New Balance</button>
    <button class="filter-btn" onclick="filterProducts('jordan', this)">Jordan</button>
    <select class="sort-select" onchange="sortProducts(this.value)">
        <option value="default">Сортировка</option>
        <option value="price_asc">Цена ↑</option>
        <option value="price_desc">Цена ↓</option>
        <option value="name">По названию</option>
    </select>
</div>


<section class="catalog-section">
    <div class="section-header">
        <span class="section-title">Каталог</span>
        <span class="section-count" id="count-label">12 товаров</span>
    </div>
    <div class="catalog-grid" id="catalog"></div>
</section>


<div class="cart-overlay" id="cart-overlay" onclick="handleOverlayClick(event)">
    <div class="cart-panel" id="cart-panel">
        <div class="cart-header">
            <span class="cart-title">Корзина</span>
            <button class="cart-close" onclick="closeCart()">✕</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer" id="cart-footer" style="display:none">
            <div class="cart-total">
                <span class="cart-total-label">Итого</span>
                <span class="cart-total-amount" id="cart-total">₴0</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Оформить заказ →</button>
        </div>
    </div>
</div>


<div class="toast" id="toast"></div>


<script src="script.js"></script>
<script src="shop.js"></script>

</body>
</html>
